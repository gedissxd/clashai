# Default settings. Don't edit this file: updates will overwrite it.
# To change a setting, put it in config.yaml in the project folder (the
# GUI's "Save config to file" button creates it). You only need the settings
# you want to change, for example:
#
#   ingame:
#     play_action: 1.5

bot:
  # The logging level for the bot.
  # Use "DEBUG" for detailed debugging information, "INFO" for general information,
  # "WARNING" for warning messages, "ERROR" for error messages, and "CRITICAL" for critical issues.
  log_level: "DEBUG"

  # Create a deck code when the game starts
  load_deck: False
  auto_start_game: False

adb:
  # The serial number of your device
  # Use adb devices to obtain it
  device_serial: emulator-5554

visuals:
  # show_images displays the bot's current view in a GUI.
  # save_images saves the images seen by the bot.
  # save_labels saves the images along with the labels and the bot's perspective.
  save_labels: False
  save_images: False
  show_images: False

ingame:
  # The delay between actions.
  # The default is 1. For faster action execution on high-performance PCs, you can set this to 0.5.
  # For lower-performance PCs, consider using 1.25 to 1.5.
  play_action: 1

screen_detector:
  # The bot recognises the lobby, battle and end-of-game screens with OneJev,
  # a small vision model. Start its server before the bot (needs an NVIDIA GPU):
  #   flide serve --model OmniJev/OneJev1.6-0.8B --port 8000
  base_url: http://localhost:8000
  # Treat answers below this probability as an unknown screen.
  min_confidence: 0.5
  # Seconds between checks, and how long an answer stays valid.
  interval: 1.0
  max_age: 5.0
  timeout: 10.0

ai:
  # Play with a model trained on your own games instead of the hand-written
  # rules. See docs/ai-training.md for how to record games and train it.
  enabled: False
  # Where scripts/train.py saved the model, relative to the project folder.
  model_path: ai_models/policy.onnx
  # How sure the model must be, compared with waiting, before it plays a
  # card (0-1). Lower it if the bot waits too much, raise it if it spams.
  play_threshold: 0.5
  # Your deck by card name, for scripts/record.py, e.g. [archers, knight, ...].
  # Leave empty to use the deck from main.py.
  deck: []
  # If scripts/record.py --check-touch shows your taps in the wrong place,
  # fix the touch axes here.
  touch:
    swap_xy: False
    flip_x: False
    flip_y: False
